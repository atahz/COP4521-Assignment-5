<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
    </head>
<body>
    <br><br>
    <p style="padding-left: 45px; display: inline;">Query Result :</p>
    {% if errors %}
        <ul style="list-style-type: none; padding-left: 0;">
            {% for e in errors %}
               <li>{{ e }}</li>
            {% endfor %}
        </ul>
    {% else %}
        <p style="display: inline">Record successfully added</p>
    {% endif %}
    <br><br>
    <a href="/">back to home</a>
</body>
